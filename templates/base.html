<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexo Monitor</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#0a101b;color:#e9eef8}*{box-sizing:border-box}body{margin:0}header{padding:24px 5%;border-bottom:1px solid #243047;display:flex;gap:24px;align-items:center}header strong{font-size:22px;color:#66e2c1}a{color:#83baff;text-decoration:none}main{max-width:1400px;margin:auto;padding:32px 5%}h1{font-size:30px;margin:0 0 12px}.muted{color:#9caac0}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:28px 0}.card{background:#121d2e;border:1px solid #27364e;border-radius:16px;padding:22px}.number{font-size:36px;font-weight:700;margin-top:8px}.table{overflow:auto;border:1px solid #27364e;border-radius:16px}table{width:100%;border-collapse:collapse;white-space:nowrap}td,th{text-align:left;padding:16px;border-bottom:1px solid #243047}th{color:#9caac0;font-size:13px}.up{color:#66e2c1}.down{color:#ff808e}.unknown,.paused{color:#ffd180}button,input{font:inherit;border-radius:8px;padding:12px;border:1px solid #394a65}button{background:#66e2c1;color:#081a17;cursor:pointer}input{background:#0a101b;color:white;width:100%}.login{max-width:420px;margin:60px auto}label{display:block;margin:18px 0 8px}header form{margin-left:auto}header button{padding:7px 12px}li{margin:10px 0}@media(max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}header{flex-wrap:wrap}main{padding:24px 16px}}
</style></head><body><header><strong>◈ Nexo Monitor</strong>{% if user.is_authenticated %}<a href="/">Visão geral</a><a href="/admin/">Inventário</a><form method="post" action="/logout/">{% csrf_token %}<button>Sair</button></form>{% endif %}</header><main>{% block content %}{% endblock %}</main></body></html>
